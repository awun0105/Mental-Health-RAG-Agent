name: Supabase Keepalive

on:
  schedule:
    # Supabase Free projects can pause after inactivity. One lightweight
    # direct Supabase RPC call per day keeps local-development projects active
    # without requiring a deployed backend.
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  ping:
    name: Ping Supabase keepalive RPC
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Call Supabase keepalive RPC
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL}" ]; then
            echo "Missing required GitHub secret: SUPABASE_URL"
            exit 1
          fi

          if [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "Missing required GitHub secret: SUPABASE_ANON_KEY"
            exit 1
          fi

          curl --fail --silent --show-error \
            --request POST \
            --header "apikey: ${SUPABASE_ANON_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            --header "Content-Type: application/json" \
            --data '{"p_source":"github-actions"}' \
            "${SUPABASE_URL}/rest/v1/rpc/keepalive_ping"
